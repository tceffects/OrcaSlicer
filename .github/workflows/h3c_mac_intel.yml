name: H3C Mac Intel build

# Builds only the Intel (x86_64) macOS app, cross-compiled on an Apple Silicon
# runner the same way Orca's build_all.yml does it, without the Windows and
# Linux builds this fork does not need.
# Do not switch to macos-15-intel: Homebrew lives in /usr/local there, which is
# on the compiler's default search path, so its png.h and OpenSSL headers
# shadow the ones Orca builds (unprefixed png_* link errors, curl compiled
# against the wrong OpenSSL). On Apple Silicon Homebrew is in /opt/homebrew.
# The finished app is uploaded as OrcaSlicer_Mac_bundle_x86_64_<sha>.

on:
  push:
    branches:
      - h3c
  workflow_dispatch:

jobs:
  build_macos_x86_64:
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: macos-15
      arch: x86_64
      build-deps-only: false
      force-build: false
    secrets: inherit
