name: H3C Mac Intel build

# Builds only the Intel (x86_64) macOS app on GitHub's Intel macOS runners,
# without the Windows and Linux builds this fork does not need. Orca builds
# x86_64 on Apple Silicon runners, which kept failing to start ("not acquired
# by Runner of type hosted", capacity notices).
# On Intel runners Homebrew lives in /usr/local, which the compiler searches by
# default, so its png.h and OpenSSL headers shadowed Orca's own. build_deps.yml
# and build_orca.yml move /usr/local/include and /usr/local/lib aside on x86_64
# runners before building (fork-only steps).
# The finished app is uploaded as OrcaSlicer_Mac_bundle_x86_64_<sha>.

on:
  push:
    branches:
      - h3c
  workflow_dispatch:

jobs:
  build_macos_x86_64:
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: macos-15-intel
      arch: x86_64
      build-deps-only: false
      force-build: false
    secrets: inherit
